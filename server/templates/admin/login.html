{% extends "admin/base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="auth">
  <div class="wordmark">{{ m.logo(30) }}{{ site }} admin</div>
  <div class="panel">
    <h1>Admin login</h1>
    {% if error %}<div class="flash err" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      {{ m.csrf_field(csrf) }}
      <div class="field"><label for="u">Username</label><input id="u" name="username" type="text" autocomplete="username" required autofocus></div>
      <div class="field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" type="submit" style="width:100%">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
